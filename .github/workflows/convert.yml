name: Thumbnails and WebP Generation

on:
  push:
    branches:
      - main
jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Generate JPG thumbnails (as before)
      - name: Thumbnails generator (JPG)
        uses: subic/ghaction-thumbnails@v1.1
        with:
          source: '.'
          output: 'thumbs'
          sizes: '300'
          extensions: 'jpg'
          fit: 'contain'
          position: 'center'
          enlarge: false
          overwrite: false

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      
      - name: Convert JPG → WebP
        run: |
          mkdir -p webp
          find . -type f -iname '*.jpg' -print0 | while IFS= read -r -d '' img; do
            # strip leading "./", swap .jpg → .webp
            out="webp/${img#./}"
            out="${out%.jpg}.webp"
            mkdir -p "$(dirname "$out")"
            convert "$img" "$out"
          done
