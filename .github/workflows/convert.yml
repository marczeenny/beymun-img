name: Thumbnails and WebP Generation

on:
  push:
    branches:
      - main
    paths:
      - '**/*.jpg'

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get list of JPG adds, mods & dels
        id: changed_jpgs
        run: |
          git fetch origin ${{ github.event.before }}
          # A = added, M = modified, D = deleted
          git diff --name-status ${{ github.event.before }} ${{ github.sha }} -- '*.jpg' \
            | grep -E '^[AMD]' > jpg_changes.txt
      
      - name: Process JPG changes
        run: |
          while read status path; do
            case "$status" in
              A|M)
                # generate thumbs/$path  and webp/${path%.jpg}.webp
                ;;
              D)
                # rm thumbs/$path  webp/${path%.jpg}.webp
                ;;
            esac
          done < jpg_changes.txt

