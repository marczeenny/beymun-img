name: Thumbnails and WebP Generation

on:
  push:
    branches:
      - main
    paths:
      - '**/*.jpg'

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get list of changed jpg files
        id: changed_jpgs
        run: |
          git fetch origin ${{ github.event.before }}
          git diff --name-only --diff-filter=AM ${{ github.event.before }} ${{ github.sha }} -- '*.jpg' > changed_jpgs.txt
          cat changed_jpgs.txt
        shell: bash

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Create thumbnails and webp for changed files
        run: |
          while IFS= read -r img; do
            [ -z "$img" ] && continue
            # Create thumbnail
            mkdir -p "thumbs/$(dirname "$img")"
            convert "$img" -resize 300x300^ -gravity center -extent 300x300 "thumbs/$img"
            # Create webp
            mkdir -p "webp/$(dirname "$img")"
            convert "$img" "webp/${img%.jpg}.webp"
          done < changed_jpgs.txt
        shell: bash
